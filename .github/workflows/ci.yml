name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up verified Godot
        run: sh .github/scripts/setup-godot.sh
      - run: make ci
